const dateLabel=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const base=data.find(d=>d.date==='2026-10-11'),latest=data.at(-1);
const dividendTotal=(history.dividend_distributions||[]).reduce((sum,d)=>sum+Number(d.amount_gold||0),0);
const dividendPerCurrentShare=latest.shares>0?dividendTotal/latest.shares:null;
const issuePriceGold=5;
const cumulativeDividendReturn=dividendPerCurrentShare==null?null:100*dividendPerCurrentShare/issuePriceGold;
root.querySelector('#pag-dividend-summary').textContent='TOTAL DIVIDENDS PAID: '+fmtEN(dividendTotal,0)+' GOLD · DIVIDENDS PER CURRENTLY ISSUED SHARE: '+fmtEN(dividendPerCurrentShare,4)+' GOLD / SHARE · CUMULATIVE RETURN ON 5 GOLD ISSUE PRICE: '+fmtEN(cumulativeDividendReturn,2)+'% · '+fmtEN(dividendPerCurrentShare,4)+' Gold dividend ÷ 5 Gold issue price. Distribution metric, not a market price, future yield or individual shareholder return.';

const body=root.querySelector('#pag-history');body.replaceChildren();data.forEach(d=>{const tr=document.createElement('tr');[dateLabel(d.date),fmt(d[key],n),statuses[d.status]||'Odczyt'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)});

svg.append('title').text(label+'; dokładne wartości i statusy w tabeli historii');
